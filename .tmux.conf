# Color scheme
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm*:Tc:sitm=\E[3m'

# Extended keys (CSI u) so Ctrl+M, Ctrl+,, Ctrl+. are distinct from Enter etc.
# (terminal emits the CSI u sequences; see alacritty keyboard.bindings)
set -s extended-keys on
set -as terminal-features ',xterm*:extkeys'

# Concrete size for sessions created with no client attached (systemd/SSH on the
# EC2 devbox at boot). Without this, headless `split-window` fails "size missing".
set -g default-size 220x56

# Always spawn zsh in panes, even when the tmux server was started from a non-zsh
# context (systemd/SSH on the devbox), where it would otherwise inherit /bin/bash.
# Portable: no hardcoded path, zsh resolved via PATH. Guarded so it degrades
# gracefully if zsh isn't installed.
if-shell 'command -v zsh >/dev/null 2>&1' 'set -g default-command "exec zsh -l"'

# do not let external program rename your custom window name
set -g allow-rename off

# Issue with tmux 2.9
set -s escape-time 0

# molten.nvim lua plugin settings for tmux
set -g allow-passthrough on

# Set the prefix to ^A`
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Reload tmux config
bind r run-shell "tmux source-file ~/.tmux.conf"
#bind r source-file ~/.tmux.conf

# Set the base index for windows to 1 instead of 0
set -g base-index 1

# Unbind
unbind '"' # "bind -N 'Split window vertically' '\"' { split-window }",
unbind % # "bind -N 'Split window horizontally' % { split-window -h }",
unbind & # "bind -N 'Kill current window' & { confirm-before -p\"kill-window #W? (y/n)\" kill-window }",
unbind - # "bind -N 'Delete the most recent paste buffer' - { delete-buffer }",
unbind . # "bind -N 'Move the current window' . { command-prompt -T target { move-window -t '%%' } }",
unbind ? # "bind -N 'List key bindings' ? { list-keys -N }",
unbind [ # "bind -N 'Enter copy mode' [ { copy-mode }",
unbind ] # "bind -N 'Paste the most recent paste buffer' ] { paste-buffer -p }",
unbind c # "bind -N 'Create a new window' c { new-window }",
unbind l # "bind -N 'Select the previously current window' l { last-window }",
unbind m # "bind -N 'Toggle the marked pane' m { select-pane -m }",
unbind q # "bind -N 'Display pane numbers' q { display-panes }",
unbind p # "bind -N 'Select the next window' p { next-window }",
unbind n # "bind -N 'Select the previous window' n { previous-window }",
unbind t # "bind -N 'Show a clock' t { clock-mode }",
unbind r # "bind -N 'Redraw the current client' r { refresh-client }",
unbind s # "bind -N 'Choose a session from a list' s { choose-tree -Zs }",
unbind x # "bind -N 'Kill the active pane' x { confirm-before -p\"kill-pane #P? (y/n)\" kill-pane }",
unbind '{' # "bind -N 'Swap the active pane with the pane above' '{' { swap-pane -U }",
unbind '}' # "bind -N 'Swap the active pane with the pane below' '}' { swap-pane -D }",

# Slipt panes
bind v split-window -c "#{pane_current_path}"
bind h split-window -h -c "#{pane_current_path}"

# Windows
bind t new-window -c "#{pane_current_path}"

# Pane navigation (windows)
bind o previous-window
bind i next-window

# Workspace navigation (4 fixed workspaces per repo)
# Note: Actual bindings are set AFTER TPM loads (bottom of file)

# {{{ Copy mod
bind c copy-mode

# Set vi mode
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# Vim-like pane switching (with prefix)
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Vim-like pane switching (without prefix) - DISABLED for workspace navigation
# Use <prefix>+h/j/k/l for pane navigation instead
# bind -n C-h select-pane -L
# bind -n C-j select-pane -D
# bind -n C-k select-pane -U
# bind -n C-l select-pane -R

# Resize current pane using SHIFT + vim arrows
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5
bind -r K resize-pane -U 5
bind -r J resize-pane -D 5

# Let focus events through
set -g focus-events on

# Mouse support
set -g mouse on

# Double-tap (touchscreen) to toggle pane zoom
bind -n DoubleClick1Pane resize-pane -Z

# Alt-z zoom toggle (mobile-friendly, Vol-Down + z in Termux)
bind -n M-z resize-pane -Z

# Of course quiet
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

# Reset current window to 50/50 layout (two fresh shells)
bind n run-shell 'dir="#{pane_current_path}"; win="#{window_id}"; tmux kill-pane -a -t "$win"; tmux respawn-pane -k -t "$win" -c "$dir"; tmux split-window -t "$win" -h -p 50 -c "$dir"; tmux select-pane -t "$win.0"'

# Sessionizer (Ctrl+f works anywhere without prefix)
bind-key -n C-f run-shell "tmux neww ~/bin/.local/scripts/tmux-sessionizer"

# {{{ Tokyo Night color scheme
TOKYO_NIGHT_BG=#1A1B26
TOKYO_NIGHT_CURR_LINE=#1A1B26
TOKYO_NIGHT_FG=#a9b1d6
TOKYO_NIGHT_COMMENT=#4fd6be
TOKYO_NIGHT_CYAN=#7dcfff
TOKYO_NIGHT_GREEN=#c3e88d
TOKYO_NIGHT_ORANGE=#7aa2f7
TOKYO_NIGHT_PINK=#ff757f
TOKYO_NIGHT_PURPLE=#bb9af7
TOKYO_NIGHT_RED=#ff757f
TOKYO_NIGHT_YELLOW=#e0af68

set -g pane-border-style fg=$TOKYO_NIGHT_COMMENT
set -g pane-active-border-style fg=$TOKYO_NIGHT_ORANGE
set -g message-style bg=$TOKYO_NIGHT_CURR_LINE,fg=$TOKYO_NIGHT_CYAN
# }}}

# {{{ Status bar settings
set -g status on
set -g status-position top
set -g status-keys vi
set -g status-interval 3 # Update status bar every 3 seconds
set -g status-style bg=$TOKYO_NIGHT_BG,fg=$TOKYO_NIGHT_FG

# Left side of the status bar
set -g status-left-style default
set -g status-left-length 30
set -g status-left "  "
set -ga status-left "#[fg=$TOKYO_NIGHT_PINK]  #{?client_prefix,#[fg=yellow]PREFIX,#S}" # -a for appending, ? for conditional, #S is session name
set -ga status-left "#[fg=$TOKYO_NIGHT_COMMENT] | "

# Right side of the status bar
set -g status-right ""
set -g status-right-length 100
set -ga status-right "#[fg=$TOKYO_NIGHT_CYAN]󰉋 #(basename #{pane_current_path})" # Using bash's basename command
set -ga status-right "#[fg=$TOKYO_NIGHT_COMMENT] | "
set -ga status-right "#[fg=$TOKYO_NIGHT_GREEN]  #{pane_current_command}"
set -ga status-right "#[fg=$TOKYO_NIGHT_COMMENT] | "
set -ga status-right "#[fg=$TOKYO_NIGHT_RED]  #h" # Host name (#H for host name with domain)
set -ga status-right "#[fg=$TOKYO_NIGHT_COMMENT] | "
set -ga status-right "#[fg=$TOKYO_NIGHT_PURPLE]󰥔 %H:%M"
set -ga status-right "  "

# Padding between windows and status bar
set -Fg 'status-format[1]' '#{status-format[0]}'
set -g 'status-format[1]' ''
set -g status 2

# Window list
set -g status-justify left # position of window list: left, right, centre
# Current window
set -g window-status-current-format "#[bg=$TOKYO_NIGHT_ORANGE,fg=$TOKYO_NIGHT_CURR_LINE] *#I: #W "
# Inactive window
set -g window-status-format "#[bg=$TOKYO_NIGHT_COMMENT,fg=$TOKYO_NIGHT_CURR_LINE] #I: #W "
# }}}

# Plugins
set -g @plugin 'tmux-plugins/tpm'


# Tmux Plugin Manager
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'off'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Unbind vim-tmux-navigator keys to allow workspace navigation
# These must come AFTER TPM loads the plugin
unbind -n C-h
unbind -n C-j
unbind -n C-k
unbind -n C-l

# Re-bind workspace navigation (override vim-tmux-navigator)
bind -n C-h run-shell "~/bin/.local/scripts/switch-workspace 1"
bind -n C-j run-shell "~/bin/.local/scripts/switch-workspace 2"
bind -n C-k run-shell "~/bin/.local/scripts/switch-workspace 3"
bind -n C-l run-shell "~/bin/.local/scripts/switch-workspace 4"

# Workspaces 5-8 on the keys physically under hjkl (n m , .)
# C-n is a plain control byte and works everywhere.
bind -n C-n run-shell "~/bin/.local/scripts/switch-workspace 5"
# C-, / C-. exist only as CSI u sequences (alacritty emits them) and are distinct
# keys, so they're safe to bind — they work wherever extended-keys is negotiated
# (bare Alacritty, locally or over SSH). They no-op harmlessly otherwise.
bind -n C-, run-shell "~/bin/.local/scripts/switch-workspace 7"
bind -n C-. run-shell "~/bin/.local/scripts/switch-workspace 8"
# NOTE: there is NO C-m binding — at the tmux level C-m *is* the Enter key, so
# binding it hijacks Enter. wt6 uses the prefix fallback (C-a 6) or M-m instead.

# Bulletproof fallback: prefix + digit always switches, over any connection.
bind 1 run-shell "~/bin/.local/scripts/switch-workspace 1"
bind 2 run-shell "~/bin/.local/scripts/switch-workspace 2"
bind 3 run-shell "~/bin/.local/scripts/switch-workspace 3"
bind 4 run-shell "~/bin/.local/scripts/switch-workspace 4"
bind 5 run-shell "~/bin/.local/scripts/switch-workspace 5"
bind 6 run-shell "~/bin/.local/scripts/switch-workspace 6"
bind 7 run-shell "~/bin/.local/scripts/switch-workspace 7"
bind 8 run-shell "~/bin/.local/scripts/switch-workspace 8"

# ── Mobile-friendly (Termux: Vol-Down = Alt) ──

# Alt-hjkl workspace navigation (mirrors C-hjkl for phone)
bind -n M-h run-shell "~/bin/.local/scripts/switch-workspace 1"
bind -n M-j run-shell "~/bin/.local/scripts/switch-workspace 2"
bind -n M-k run-shell "~/bin/.local/scripts/switch-workspace 3"
bind -n M-l run-shell "~/bin/.local/scripts/switch-workspace 4"

# Alt-nm,. mirrors C-nm,. for phone (workspaces 5-8)
bind -n M-n run-shell "~/bin/.local/scripts/switch-workspace 5"
bind -n M-m run-shell "~/bin/.local/scripts/switch-workspace 6"
bind -n M-, run-shell "~/bin/.local/scripts/switch-workspace 7"
bind -n M-. run-shell "~/bin/.local/scripts/switch-workspace 8"

# Fleet dashboard — live status grid for the current workspace's 8 worktrees
# (auto-detects the repo from the current pane; works for any clone-workspace repo)
bind -n C-u run-shell "~/bin/.local/scripts/fleet-dashboard"
bind -n M-u run-shell "~/bin/.local/scripts/fleet-dashboard"

# Double-tap prefix to toggle zoom (easier than C-a z on phone)
bind C-a resize-pane -Z

# Alt-o/i window switching without prefix
bind -n M-o previous-window
bind -n M-i next-window

# Longer display times (more time to tap on phone)
set -g display-panes-time 3000
set -g display-time 3000

# Bigger scrollback
set -g history-limit 50000
